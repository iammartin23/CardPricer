<!DOCTYPE html>
<!--
  CARD VALUE FINDER, STAGE 1
  This one file is the whole app. It has three parts:
    1. HTML  (between <body> and </body>)  = what is on the page
    2. CSS   (inside <style>)              = how it looks
    3. JavaScript (inside <script>)        = what happens when you tap the button
  Lines like this one, between the arrows, are comments. The browser ignores them,
  so they are only notes for you.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- This line makes the page fit a phone screen instead of shrinking to look like a desktop site. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card value finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  /* Colors live in variables so they are easy to change in one place.
     The second block swaps them automatically when your phone is in dark mode. */
  :root {
    color-scheme: light dark;
    --paper: #f2f4f9;
    --panel: #ffffff;
    --ink: #1b2340;
    --muted: #5d667d;
    --line: #d9deea;
    --accent: #ffcf3f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10142a;
      --panel: #1a2040;
      --ink: #eef1fb;
      --muted: #9aa3c2;
      --line: #2c3359;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    line-height: 1.45;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }

  h1 { font-size: 2rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; }
  .lede { margin: 0 0 20px; color: var(--muted); }

  form { display: grid; gap: 12px; margin-bottom: 12px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 0.95rem; }
  input {
    font: inherit; font-weight: 400;
    padding: 12px; min-height: 48px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink);
  }
  button {
    font: inherit; font-weight: 800;
    min-height: 52px; border: 0; border-radius: 8px;
    background: var(--accent); color: #1b2340; cursor: pointer;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  #status { min-height: 1.5em; color: var(--muted); }

  /* Each result is a row: picture on the left, details on the right. */
  .card {
    display: grid; grid-template-columns: 110px 1fr; gap: 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 12px;
  }
  .card img { width: 100%; height: auto; border-radius: 6px; }
  .card h2 { font-size: 1.15rem; margin: 0; }
  .muted { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .price-row { margin-top: 10px; }
  .price-label { font-size: 0.85rem; color: var(--muted); margin: 0; }
  .price {
    font-size: 1.6rem; font-weight: 800; margin: 0;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .price small { font-size: 0.8rem; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .note { margin-top: 24px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>

<body>
<main>
  <h1>Card value finder</h1>
  <p class="lede">Search a Pokémon card to see its recent market price.</p>

  <!-- The search form. Each <input> is a box you type in. -->
  <form id="search-form">
    <label>Card name
      <input id="card-name" type="text" placeholder="Charizard" autocomplete="off" required>
    </label>
    <label>Card number (optional, narrows the search)
      <input id="card-number" type="text" placeholder="4 or 4/102" autocomplete="off">
    </label>
    <button type="submit">Look up value</button>
  </form>

  <!-- The script writes messages and results into these two empty spots. -->
  <p id="status" role="status"></p>
  <section id="results"></section>

  <p class="note">
    Prices are estimates from TCGplayer (US dollars) and Cardmarket (euros).
    Condition, edition, and grading can change what a card really sells for.
  </p>
</main>

<script>
  // OPTIONAL: paste a free key from https://dev.pokemontcg.io between the quotes.
  // Without a key you can make about 1,000 searches a day. With one, about 20,000.
  // Anyone can see a key placed in a web page, which is fine for a personal tool.
  const API_KEY = "";

  // Grab the parts of the page we need to talk to, using the id names from the HTML above.
  const form = document.getElementById("search-form");
  const nameInput = document.getElementById("card-name");
  const numberInput = document.getElementById("card-number");
  const statusLine = document.getElementById("status");
  const results = document.getElementById("results");

  // Small helper: makes a page element (like a paragraph) with some text and a style class.
  function el(tag, text, className) {
    const element = document.createElement(tag);
    if (text) element.textContent = text;
    if (className) element.className = className;
    return element;
  }

  // Turns a number like 12.5 into "$12.50" (or "€12.50" for euros).
  function money(value, currency) {
    return new Intl.NumberFormat("en-US", { style: "currency", currency: currency }).format(value);
  }

  // The price service names card finishes in code-style words. This translates them.
  const VARIANT_NAMES = {
    normal: "Normal",
    holofoil: "Holofoil",
    reverseHolofoil: "Reverse holofoil",
    "1stEditionNormal": "1st edition normal",
    "1stEditionHolofoil": "1st edition holofoil",
    unlimitedHolofoil: "Unlimited holofoil"
  };

  // Builds one price block, such as "Holofoil / $350.00 / low $200.00 to high $900.00".
  function priceBlock(label, value, currency, rangeText) {
    const block = el("div", "", "price-row");
    block.append(el("p", label, "price-label"));
    const price = el("p", money(value, currency), "price");
    if (rangeText) {
      price.append(" ", el("small", rangeText));
    }
    block.append(price);
    return block;
  }

  // Builds the whole row for one card.
  function renderCard(card) {
    const row = el("article", "", "card");

    const image = document.createElement("img");
    image.src = card.images.small;
    image.alt = card.name;
    image.loading = "lazy";

    const info = el("div");
    info.append(el("h2", card.name));
    info.append(el("p", card.set.name, "muted"));
    info.append(el("p", "Number " + card.number + " of " + card.set.printedTotal, "muted"));
    if (card.rarity) info.append(el("p", card.rarity, "muted"));

    // TCGplayer gives one price per finish (normal, holofoil, and so on).
    // "market" is its estimate based on recent sales. If missing, we fall back to "mid".
    const usPrices = card.tcgplayer && card.tcgplayer.prices;
    let foundPrice = false;
    if (usPrices) {
      for (const [variant, p] of Object.entries(usPrices)) {
        const value = p.market != null ? p.market : p.mid;
        if (value == null) continue;
        const range = (p.low != null && p.high != null)
          ? "low " + money(p.low, "USD") + " to high " + money(p.high, "USD")
          : "";
        info.append(priceBlock(VARIANT_NAMES[variant] || variant, value, "USD", range));
        foundPrice = true;
      }
    }

    // Cardmarket (Europe) gives a "trend" price in euros.
    const euPrices = card.cardmarket && card.cardmarket.prices;
    if (euPrices && euPrices.trendPrice != null) {
      const avg = euPrices.avg30 != null ? "30-day average " + money(euPrices.avg30, "EUR") : "";
      info.append(priceBlock("Cardmarket trend", euPrices.trendPrice, "EUR", avg));
      foundPrice = true;
    }

    if (!foundPrice) info.append(el("p", "No price data for this card yet.", "muted"));

    row.append(image, info);
    return row;
  }

  // This runs every time you tap "Look up value".
  form.addEventListener("submit", async (event) => {
    event.preventDefault(); // stops the page from reloading when the form is sent

    // Clean up what you typed: remove quote marks, and keep only the part of "4/102" before the slash.
    const name = nameInput.value.replace(/["\\]/g, "").trim();
    const number = numberInput.value.split("/")[0].replace(/[^A-Za-z0-9-]/g, "");
    if (!name) {
      statusLine.textContent = "Enter a card name to search.";
      return;
    }

    // Build the question we ask the price service, for example: name:"Charizard" number:4
    let query = 'name:"' + name + '"';
    if (number) query += " number:" + number;
    const url = "https://api.pokemontcg.io/v2/cards?pageSize=12&orderBy=-set.releaseDate&q=" +
      encodeURIComponent(query);

    results.replaceChildren(); // clear old results
    statusLine.textContent = "Searching…";

    try {
      // fetch() sends the question over the internet and waits for the answer.
      const response = await fetch(url, { headers: API_KEY ? { "X-Api-Key": API_KEY } : {} });

      if (response.status === 429) {
        statusLine.textContent = "Too many searches right now. Wait a minute, or add a free API key at the top of the script.";
        return;
      }
      if (!response.ok) throw new Error("Unexpected response: " + response.status);

      const data = await response.json();
      const cards = data.data;

      if (cards.length === 0) {
        statusLine.textContent = "No cards found. Check the spelling or clear the number.";
        return;
      }
      statusLine.textContent = "Showing " + cards.length + " newest matches.";
      cards.forEach((card) => results.append(renderCard(card)));
    } catch (error) {
      statusLine.textContent = "Couldn’t reach the price service. Check your connection and try again.";
    }
  });
</script>
</body>
</html>
